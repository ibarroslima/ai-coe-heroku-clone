  --shadow:0 2px 8px rgba(0,30,91,.06); --shadow-lg:0 18px 48px rgba(0,30,91,.18);
  --head:"Avant Garde","Avenir Next","Century Gothic","Futura",system-ui,sans-serif;
  --body:"Salesforce Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --r:12px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--body);color:var(--ink);background:var(--mist);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--head);color:var(--navy);margin:0;font-weight:600;letter-spacing:-.01em}
.wrap{width:min(1200px,92vw);margin:0 auto}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Header ---------- */
.top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:68px;height:auto}
.brand{display:flex;align-items:center;gap:12px;color:var(--navy)}
.brand:hover{text-decoration:none}
.brand img{height:34px}
.brand b{font-family:var(--head);font-size:20px;font-weight:700;letter-spacing:.02em}
.brand span{display:block;white-space:nowrap;font-size:11.5px;color:var(--ink-2);line-height:1.2}
nav.main{display:flex;gap:4px}
nav.main a{white-space:nowrap;padding:8px 14px;border-radius:999px;color:var(--navy);font-weight:500;font-size:15px}
nav.main a:hover{background:var(--mist);text-decoration:none}
nav.main a[aria-current=page]{background:var(--navy);color:#fff}
.top .tools{margin-left:auto;display:flex;align-items:center;gap:10px}
.kbtn{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border:1px solid var(--line);background:#fff;border-radius:999px;color:var(--ink-2);font-size:14px;white-space:nowrap}
.kbtn kbd{margin-left:auto;font:12px var(--body);background:var(--mist);border-radius:6px;padding:1px 6px;color:var(--navy)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:#fff}
.lang button{border:0;background:none;padding:4px 9px;border-radius:999px;font-size:13px;color:var(--ink-2);font-weight:600}
.lang button[aria-pressed=true]{background:var(--mist);color:var(--navy)}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 18px;border-radius:999px;border:1px solid transparent;font-weight:600;font-size:15px;white-space:nowrap}
.btn:hover{text-decoration:none}
.btn.primary{background:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-30)}
.btn.ghost{background:#fff;color:var(--navy);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--sky-80)}
.btn.sm{height:34px;padding:0 14px;font-size:14px}

/* ---------- Home hero ---------- */
.hero{background:var(--navy);color:#fff;position:relative;z-index:2}
.hero::before{content:"";position:absolute;inset:0;overflow:hidden;background:
  radial-gradient(700px 380px at 82% 30%,rgba(0,179,255,.28),transparent 65%),
  radial-gradient(500px 300px at 10% 110%,rgba(6,106,254,.35),transparent 70%)}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.25fr .75fr;align-items:center;gap:24px;padding:64px 0 72px}
.hero h1{color:#fff;font-size:clamp(32px,3.8vw,48px);line-height:1.1;max-width:19ch}
.hero p.lead{color:#cfe2ff;font-size:18px;max-width:52ch;margin:18px 0 28px}
.hero .bot{width:min(380px,100%);height:auto;justify-self:end;object-fit:contain;background:transparent;filter:drop-shadow(0 24px 36px rgba(0,0,0,.35));transform:scaleX(-1)}
.qs{position:relative;max-width:640px}
.qs label{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:0 8px 0 18px;height:62px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.qs label .ico{color:var(--blue);width:22px;height:22px}
.qs input{flex:1;border:0;outline:0;font:18px var(--body);color:var(--navy);background:none;min-width:0}
.qs input::placeholder{color:#8a97ad}
.qs .go{height:46px}
.qs-results{position:absolute;left:0;right:0;top:70px;background:#fff;border-radius:14px;box-shadow:var(--shadow-lg);padding:8px;display:none;z-index:5;color:var(--ink)}
.qs-results.show{display:block}
.qs-results a,.pal-list a{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:10px;color:var(--ink)}
.qs-results a:hover,.qs-results a.on,.pal-list a:hover,.pal-list a.on{background:var(--mist);text-decoration:none}
.qs-results small,.pal-list small{display:block;color:var(--ink-2);font-size:13px}
.qs-results strong,.pal-list strong{color:var(--navy);font-weight:600}
.qs-results .all{justify-content:center;color:var(--blue);font-weight:600;border-top:1px solid var(--line);border-radius:0 0 10px 10px;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chips span{color:#9fb6dd;font-size:14px;align-self:center;margin-right:2px}
.chips button{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:#fff;border-radius:999px;padding:5px 12px;font-size:14px}
.chips button:hover{background:rgba(255,255,255,.16)}
.pulse{background:#fff;border-bottom:1px solid var(--line)}
.pulse .wrap{padding:18px 0;color:var(--navy);font-size:16px;display:flex;flex-wrap:wrap;gap:6px 28px;align-items:center}
.pulse b{font-family:var(--head);font-size:22px;margin-right:4px}

/* ---------- Sections ---------- */
main{min-height:70vh}
.sec{padding:52px 0 8px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:18px}
.sec-h h2{font-size:26px}
.sec-h p{margin:4px 0 0;color:var(--ink-2)}
.card{background:#fff;border-radius:var(--r);box-shadow:var(--shadow)}
.two{display:grid;grid-template-columns:1.35fr 1fr;gap:24px;align-items:start}

/* list rows (recientes) */
.rows{padding:6px}
.row{display:grid;grid-template-columns:40px 1fr auto;gap:14px;align-items:center;padding:12px;border-radius:10px;color:var(--ink);cursor:pointer;border:0;background:none;text-align:left;width:100%}
.row:hover{background:var(--mist)}
.row strong{display:block;color:var(--navy);font-weight:600;line-height:1.3}
.row small{color:var(--ink-2);font-size:13.5px}
.row time{font-size:13px;color:var(--ink-2);white-space:nowrap}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;flex:none}
.av.lg{width:44px;height:44px;font-size:15px}

/* key resources */
.keys{display:grid;gap:12px}
.key{display:grid;grid-template-columns:44px 1fr;gap:14px;padding:16px;color:var(--ink)}
.key:hover{text-decoration:none;box-shadow:0 6px 18px rgba(0,30,91,.10)}
.key .k-ico{width:44px;height:44px;border-radius:10px;background:var(--mist);color:var(--blue);display:grid;place-items:center}
.key .k-ico .ico{width:22px;height:22px}
.key strong{color:var(--navy);display:flex;align-items:center;gap:6px}
.key strong .ico{width:14px;height:14px;color:var(--ink-2)}
.key p{margin:2px 0 0;font-size:14px;color:var(--ink-2);line-height:1.4}
.keys.grid{grid-template-columns:repeat(auto-fill,minmax(215px,1fr))}

/* learning feature */
.learn{display:grid;grid-template-columns:1.1fr 1fr;overflow:hidden}
.learn .img{background-size:cover;background-position:center;min-height:320px;position:relative}
.learn .img .play{position:absolute;left:24px;bottom:24px;width:64px;height:64px;border-radius:50%;background:#fff;color:var(--navy);display:grid;place-items:center;box-shadow:var(--shadow-lg)}
.learn .img .play .ico{width:26px;height:26px;fill:currentColor;margin-left:3px}
.learn .txt{padding:32px}
.learn .txt h3{font-size:28px;margin:6px 0 4px}
.tagline{color:var(--blue);font-weight:600}
.learn ul{padding:0;margin:16px 0 22px;list-style:none;display:grid;gap:6px;font-size:15px}
.learn li{display:flex;gap:8px}
.learn li .ico{color:var(--teal);width:18px;height:18px;margin-top:2px}
.vlangs{display:flex;gap:10px;flex-wrap:wrap}
.meta{font-size:14px;color:var(--ink-2)}

/* contributors + CTA */
.people{display:flex;flex-wrap:wrap;gap:10px}
.person{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:999px;background:#fff;box-shadow:var(--shadow);color:var(--navy);font-size:14.5px;border:0}
.person:hover{box-shadow:0 6px 18px rgba(0,30,91,.12)}
.person em{font-style:normal;color:var(--ink-2)}
.cta{margin:56px 0 0;background:linear-gradient(120deg,var(--blue-30),var(--blue));color:#fff;border-radius:18px;padding:36px 40px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
.cta h2{color:#fff;font-size:26px}
.cta p{margin:6px 0 0;color:#d9e8ff;max-width:56ch}
.cta .btn{background:#fff;color:var(--navy)}

/* ---------- Catálogo ---------- */
.page-h{padding:40px 0 20px}
.page-h h1{font-size:34px}
.page-h p{margin:6px 0 0;color:var(--ink-2);max-width:70ch}
.cat{display:grid;grid-template-columns:250px 1fr;gap:28px;align-items:start;padding-bottom:40px}
.facets{position:sticky;top:88px;display:grid;gap:18px;max-height:calc(100vh - 110px);overflow:auto;padding-right:4px}
.facet h3{font-family:var(--body);font-size:14px;color:var(--navy);margin:0 0 6px;font-weight:700}
.facet label{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:8px;font-size:14.5px;cursor:pointer;color:var(--ink)}
.facet label:hover{background:#fff}
.facet input{accent-color:var(--blue);width:16px;height:16px}
.facet label span{flex:1}
.facet label i{font-style:normal;font-size:12.5px;color:var(--ink-2);background:#fff;border-radius:999px;padding:0 7px}
.facet .more{border:0;background:none;color:var(--blue);font-size:13.5px;padding:4px 6px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.search{flex:1;min-width:240px;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:0 14px;height:46px}
.search:focus-within{border-color:var(--blue)}
.search .ico{color:var(--ink-2)}
.search input{flex:1;border:0;outline:0;font:16px var(--body);color:var(--navy);background:none;min-width:0}
select.sel{height:46px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 12px;font:15px var(--body);color:var(--navy)}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px;height:46px}
.seg button{border:0;background:none;border-radius:9px;padding:0 10px;color:var(--ink-2)}
.seg button[aria-pressed=true]{background:var(--mist);color:var(--navy)}
.count{color:var(--ink-2);font-size:14.5px;margin:0 0 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.count b{color:var(--navy)}
.fchip{display:inline-flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 6px 2px 10px;font-size:13px;color:var(--navy)}
.fchip button{border:0;background:none;padding:0;display:grid;color:var(--ink-2)}
.fchip .ico{width:14px;height:14px}
.clear{border:0;background:none;color:var(--blue);font-size:13.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.case{display:flex;flex-direction:column;gap:10px;padding:18px;cursor:pointer;text-align:left;border:0;width:100%;color:var(--ink);position:relative}
.case:hover{box-shadow:0 8px 22px rgba(0,30,91,.12)}
.case .type{font-size:13px;font-weight:600;display:flex;gap:6px;align-items:center}
.case .type i{width:8px;height:8px;border-radius:50%;display:inline-block}
.case h3{font-size:18px;line-height:1.25;padding-right:28px}
.case p{margin:0;font-size:14.5px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;line-height:1.45}
.case .foot{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2);padding-top:6px}
.case .foot .av{width:28px;height:28px;font-size:11px}
.case .foot .who{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12.5px;background:var(--mist);color:var(--navy);border-radius:6px;padding:2px 8px}
.wip{font-size:12px;background:var(--yellow-95);color:#6f3400;border-radius:6px;padding:2px 8px;font-weight:600}
.fav{position:absolute;top:14px;right:12px;border:0;background:none;color:#a9b6cc;padding:4px;border-radius:8px}
.fav:hover{color:var(--yellow)}
.fav[aria-pressed=true]{color:var(--yellow)}
.fav[aria-pressed=true] .ico{fill:var(--yellow)}
.grid.list{grid-template-columns:1fr;gap:8px}
.grid.list .case{display:grid;grid-template-columns:1fr 220px;gap:4px 24px;padding:14px 18px}
.grid.list .case p{-webkit-line-clamp:1;grid-column:1}
.grid.list .case .tags{grid-column:1}
.grid.list .case .foot{grid-column:2;grid-row:1 / span 4;margin:0;align-self:center}
.empty{padding:48px;text-align:center}
.empty h3{font-size:20px;margin-bottom:6px}
.empty p{color:var(--ink-2);margin:0 0 16px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,30,91,.38);opacity:0;pointer-events:none;transition:opacity .2s;z-index:80}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:#fff;z-index:90;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.drawer.show{transform:none}
.drawer header{display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line)}
.drawer header .sp{flex:1}
.icon-btn{border:0;background:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--navy)}
.icon-btn:hover{background:var(--mist)}
.drawer .body{padding:24px 28px 32px;overflow:auto}
.drawer h2{font-size:26px;line-height:1.2;margin:8px 0 16px}
.byline{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.byline strong{color:var(--navy);display:block}
.byline small{color:var(--ink-2)}
.desc{white-space:pre-line;color:var(--ink);font-size:15.5px;line-height:1.6}
.links{display:grid;gap:8px;margin:22px 0}
.link-btn{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;color:var(--navy);font-weight:600}
.link-btn:hover{border-color:var(--blue);text-decoration:none;background:var(--mist)}
.link-btn small{display:block;font-weight:400;color:var(--ink-2);font-size:12.5px;word-break:break-all}
.link-btn .ico{margin-left:auto;color:var(--blue)}
.kdot{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;flex:none}
dl.facts{display:grid;grid-template-columns:120px 1fr;gap:8px 16px;margin:20px 0 0;font-size:14.5px}
dl.facts dt{color:var(--ink-2)}
dl.facts dd{margin:0;color:var(--navy)}
.note{font-size:13px;color:var(--ink-2);margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}

/* ---------- Recursos ---------- */
.res-tools{display:flex;gap:10px;margin:28px 0 16px;align-items:center;flex-wrap:wrap}
.res-tools .search{max-width:520px}
.groups{columns:2 380px;column-gap:20px;padding-bottom:40px}
.group{break-inside:avoid;margin:0 0 20px;padding:18px 18px 10px}
.group h3{font-size:17px;display:flex;align-items:center;gap:10px;margin-bottom:8px}
.group h3 .g-ico{width:34px;height:34px;border-radius:9px;background:var(--mist);color:var(--blue);display:grid;place-items:center}
.group h3 small{margin-left:auto;font:13px var(--body);color:var(--ink-2)}
.group ul{list-style:none;margin:0;padding:0}
.group li a{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:8px;color:var(--ink);font-size:14.5px;line-height:1.3}
.group li a:hover{background:var(--mist);text-decoration:none}
.group li a .kdot{width:22px;height:22px;font-size:9px;border-radius:6px}
.group li a em{margin-left:auto;font-style:normal;font-size:12px;color:var(--ink-2);white-space:nowrap}
mark{background:var(--yellow-95);color:inherit;border-radius:3px;padding:0 1px}

/* ---------- Learning ---------- */
.sess{display:grid;grid-template-columns:1fr 1fr;overflow:hidden;margin-bottom:24px}
.sess .img{background-size:cover;background-position:center;min-height:360px}
.sess .txt{padding:34px}
.vids{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
.vid{color:var(--navy);font-size:14px;font-weight:600}
.vid:hover{text-decoration:none}
.vid .th{aspect-ratio:16/9;border-radius:10px;background-size:cover;background-position:center;position:relative;margin-bottom:6px}
.vid .th::after{content:attr(data-dur);position:absolute;right:6px;bottom:6px;background:rgba(0,30,91,.8);color:#fff;font-size:11px;padding:1px 6px;border-radius:5px}
.vid:hover .th{outline:2px solid var(--blue);outline-offset:2px}
.soon{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;padding-bottom:40px}
.soon .card{padding:20px;border:2px dashed var(--sky-80);background:transparent;box-shadow:none}
.soon h3{font-size:16px}
.soon p{margin:4px 0 0;color:var(--ink-2);font-size:14px}

/* ---------- Acerca ---------- */
.about{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding-bottom:20px}
.about .card{padding:26px}
.about h3{font-size:19px;margin-bottom:8px}
.about p{margin:0;font-size:16px}
.princ{counter-reset:p;list-style:none;padding:0;margin:0;display:grid;gap:12px}
.princ li{counter-increment:p;display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:center;font-size:16px;color:var(--navy)}
.princ li::before{content:counter(p);width:32px;height:32px;border-radius:50%;background:var(--mist);color:var(--blue);display:grid;place-items:center;font-weight:700;font-family:var(--head)}

/* ---------- Palette ⌘K + modal + toast ---------- */
.pal{position:fixed;inset:0;z-index:120;display:none;align-items:flex-start;justify-content:center;padding-top:12vh;background:rgba(0,30,91,.42)}
.pal.show{display:flex}
.pal-box{width:min(640px,94vw);background:#fff;border-radius:16px;box-shadow:var(--shadow-lg);overflow:hidden}
.pal-box .search{border:0;border-bottom:1px solid var(--line);border-radius:0;height:58px}
.pal-list{max-height:56vh;overflow:auto;padding:8px}
.pal-list h4{margin:10px 12px 4px;font-size:12.5px;color:var(--ink-2);font-weight:600}
.pal-list .kdot,.qs-results .kdot{width:30px;height:30px}
.pal-foot{display:flex;gap:16px;padding:10px 16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-2)}
.pal-foot kbd,.hint kbd{font:12px var(--body);background:var(--mist);border-radius:5px;padding:0 5px;color:var(--navy)}
.modal{position:fixed;inset:0;z-index:110;display:none;align-items:center;justify-content:center;background:rgba(0,30,91,.42);padding:16px}
.modal.show{display:flex}
.modal-box{width:min(620px,96vw);background:#fff;border-radius:16px;box-shadow:var(--shadow-lg);max-height:92vh;overflow:auto}
.modal-box header{padding:22px 26px 0;display:flex;justify-content:space-between;align-items:flex-start}
.modal-box header p{margin:4px 0 0;color:var(--ink-2);font-size:14.5px}
.modal-box form{padding:18px 26px 26px;display:grid;gap:14px}
.fld{display:grid;gap:6px;font-size:14px;color:var(--navy);font-weight:600}
.fld input,.fld select,.fld textarea{font:15px var(--body);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--navy);font-weight:400}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:0;border-color:var(--blue)}
.fld small{font-weight:400;color:var(--ink-2)}
.fld2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;box-shadow:var(--shadow-lg);opacity:0;transition:.25s;z-index:200;font-size:15px;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

footer{margin-top:60px;background:#fff;border-top:1px solid var(--line)}
footer .wrap{padding:26px 0;display:flex;gap:16px 32px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--ink-2)}
footer .sp{flex:1}
.proto{background:var(--yellow-95);color:#6f3400;border-radius:999px;padding:3px 10px;font-weight:600;font-size:12.5px}

/* ---------- Responsive ---------- */
.filters-btn{display:none!important}
@media (max-width:1480px){.kbtn .lbl{display:none}}
@media (max-width:1360px){.brand span{display:none}}
@media (max-width:1180px){.kbtn{min-width:0}.kbtn kbd{display:none}}
@media (max-width:1100px){.top .tools .btn.primary .lbl{display:none}.top .tools .btn.primary{padding:0 12px}}
@media (max-width:920px){
  .top .wrap{flex-wrap:wrap;height:auto;padding:10px 0;gap:10px}
  nav.main{order:3;width:100%;overflow-x:auto}
  .brand span{display:none}
  .hero .wrap{grid-template-columns:1fr;padding:40px 0 48px}
  .hero .bot{display:none}
  .two,.learn,.sess,.about{grid-template-columns:1fr}
  .learn .img,.sess .img{min-height:220px}
  .cat{grid-template-columns:1fr}
  .facets{position:static;max-height:none;display:none;background:#fff;border-radius:12px;padding:16px}
  .facets.open{display:grid}
  .filters-btn{display:inline-flex!important}
  .grid.list .case{grid-template-columns:1fr}
  .grid.list .case .foot{grid-column:1;grid-row:auto}
}
@media (max-width:560px){
  .top .tools .btn.primary .lbl{display:none}
  .top .tools .btn.primary{padding:0 12px}
  .vids{grid-template-columns:1fr 1fr}
  .fld2{grid-template-columns:1fr}
  .cta{padding:28px 24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

.flag-cloud{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#d7ecff;font-size:22px;overflow:hidden;flex:none;line-height:1}
.flag-cloud .cloud-img{width:22px;height:22px;object-fit:contain;display:block}
.admin-only{display:none!important}
body.is-admin .admin-only, .admin-only.show{display:inline-flex!important}
.btn.danger{border-color:#ffd0d8;color:#b60554;background:#fff}
.drawer-admin{display:flex;gap:8px;align-items:center}
.res-admin,.learn-admin{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 0}
.link-admin{display:inline-flex;gap:6px;margin-left:auto}
.link-admin button{border:0;background:none;color:var(--blue);font-size:12px;font-weight:600;padding:0}
.users-list{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.users-list li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.users-list button{border:0;background:none;color:#b60554;font-weight:600}
footer a.classic{font-weight:600}
.top .tools{flex-wrap:nowrap;justify-content:flex-end;flex:none;gap:8px}
body.is-admin .top .tools{flex-wrap:wrap}

</style>

<script>
const DATA = {"cases": [{"id": 728, "type": "value", "tech": ["Financial Services Cloud", "Marketing Cloud", "Mulesoft", "Data 360", "Tableau", "Agentforce"], "phase": "SOW", "theme": "Proposal Generation", "author": "Irineu Silva", "ini": "IS", "status": "in_progress", "date": "2026-09-02", "tags": ["business value map", "public sector"], "links": [], "i18n": {"es": {"t": "Business Value Proposition - Caixa", "d": "AI artifacts created during the negotiation phase of the Caixa deal. There are some artifacts that could be reused to similar public sector financial services companies.\n1. Executive briefing (return on investment, business value mapping)\n2. Internal financial simulator for different scenarios applying dynamic values for Risk Reserve, Bill Rate, Discount, Total Value, Expenses, AI Optimization.\n3. Change management readiness"}, "pt": {"t": "Proposta de Valor Empresarial – Caixa", "d": "Artefatos de IA criados durante a fase de negociação do negócio Caixa. Existem alguns artefactos que poderiam ser reutilizados em empresas semelhantes de serviços financeiros do sector público.\n1. Briefing executivo (retorno do investimento, mapeamento do valor do negócio)\n2. Simulador financeiro interno para diversos cenários aplicando valores dinâmicos de Reserva de Risco, Taxa de Faturamento, Desconto, Valor Total, Despesas, Otimização de IA.\n3. Prontidão para gerenciamento de mudanças"}, "en": {"t": "Business Value Proposition - Caixa", "d": "AI artifacts created during the negotiation phase of the Caixa deal. There are some artifacts that could be reused to similar public sector financial services companies.\n1. Executive briefing (return on investment, business value mapping)\n2. Internal financial simulator for different scenarios applying dynamic values for Risk Reserve, Bill Rate, Discount, Total Value, Expenses, AI Optimization.\n3. Change management readiness"}}}, {"id": 727, "type": "tool", "tech": ["ITSM"], "phase": null, "theme": "Scoping", "author": "Julio Carmo", "ini": "JC", "status": "completed", "date": "2026-09-02", "tags": ["ITSM", "Scoping", "Salesforce"], "links": [], "i18n": {"es": {"t": "ITSM — Professional Services", "d": "This initiative delivers a live, end-to-end IT Service Management (ITSM) capability directly within the primary Salesforce internal environment (ORG62), tailored specifically for the Professional Services sector. Designed to streamline service delivery across the global pipeline, this solution standardizes incident, problem, change, and request management workflows. By leveraging native ORG62 architecture, it provides real-time visibility into service operations, enhances cross-team collaboration, and optimizes resource allocation to ensure high-quality, predictable service delivery for global engagements."}, "pt": {"t": "ITSM — Professional Services", "d": "This initiative delivers a live, end-to-end IT Service Management (ITSM) capability directly within the primary Salesforce internal environment (ORG62), tailored specifically for the Professional Services sector. Designed to streamline service delivery across the global pipeline, this solution standardizes incident, problem, change, and request management workflows. By leveraging native ORG62 architecture, it provides real-time visibility into service operations, enhances cross-team collaboration, and optimizes resource allocation to ensure high-quality, predictable service delivery for global engagements."}, "en": {"t": "ITSM — Professional Services", "d": "This initiative delivers a live, end-to-end IT Service Management (ITSM) capability directly within the primary Salesforce internal environment (ORG62), tailored specifically for the Professional Services sector. Designed to streamline service delivery across the global pipeline, this solution standardizes incident, problem, change, and request management workflows. By leveraging native ORG62 architecture, it provides real-time visibility into service operations, enhances cross-team collaboration, and optimizes resource allocation to ensure high-quality, predictable service delivery for global engagements."}}}, {"id": 694, "type": "asset", "tech": ["Slack", "Cursor", "Gemini"], "phase": null, "theme": null, "author": "Alejandra Acuña", "ini": "AA", "status": "completed", "date": "2026-08-22", "tags": ["Bookmark", "Cursor"], "links": [], "i18n": {"es": {"t": "Bookmark Central LATAM", "d": "En desarrollo: actualizando, optimizando y agrupando todos los enlaces principales del día a día de Preventas para actualizar la Sección 2 de Bookmark Central"}, "pt": {"t": "Favoritos Central LATAM", "d": "Em desenvolvimento: atualizando, otimizando e agrupando todos os principais links de Pré-vendas do dia a dia para atualizar a Seção 2 do Bookmark Central"}, "en": {"t": "Bookmark Central LATAM", "d": "In development: updating, optimizing and grouping all the main day-to-day Presales links to update Section 2 of Bookmark Central"}}}, {"id": 661, "type": "asset", "tech": ["AI-native"], "phase": "Discovery", "theme": "Discovery", "author": "Ixchel Saucedo", "ini": "IS", "status": "in_progress", "date": "2026-08-17", "tags": ["IA native"], "links": [], "i18n": {"es": {"t": "Discoverys y ejemplos de enfoques nativos de IA", "d": "En desarrollo: material de apoyo que explica cómo funcionan los «descubrimientos» y ejemplos de cómo abordar la IA nativa"}, "pt": {"t": "Descobertas e exemplos de abordagens nativas de IA", "d": "Em desenvolvimento: material de apoio explicando como funcionam as “descobertas” e exemplos de como abordar a IA nativa"}, "en": {"t": "Discoveries and examples of native AI approaches", "d": "In development: supporting material explaining how “discoveries” work and examples of how to approach native AI"}}}, {"id": 628, "type": "tool", "tech": ["Slack"], "phase": "Discovery", "theme": "Discovery", "author": "Julio Carmo", "ini": "JC", "status": "in_progress", "date": "2026-08-11", "tags": ["SLACK", "Discovery", "sizing", "proposal"], "links": [], "i18n": {"es": {"t": "Slack PS: estimaciones de referencia", "d": "PD: estimaciones de referencia\nUn espacio colaborativo para compartir, discutir y mantener estimaciones de referencia para compromisos de Servicios Profesionales.\nUtilice este canal para:\n• Compartir estimaciones históricas, puntos de referencia y referencias de tamaño\n• Comparar estimaciones entre proyectos, soluciones y modelos de entrega.\n• Discutir supuestos, factores de complejidad y metodologías de estimación.\n• Mejorar la coherencia y precisión en las estimaciones de ROM, propuestas y SOW\n• Captar las lecciones aprendidas y mejorar continuamente nuestras prácticas de estimación.\nObjetivo: crear una base de referencia confiable que ayude a los equipos de PS a realizar estimaciones más rápidas, más consistentes y con mayor confianza."}, "pt": {"t": "Slack PS — Estimativas de Referência", "d": "PS — Reference Estimates\nA collaborative space for sharing, discussing, and maintaining reference estimates for Professional Services engagements.\nUse this channel to:\n• Share historical estimates, benchmarks, and sizing references\n• Compare estimates across projects, solutions, and delivery models\n• Discuss assumptions, complexity drivers, and estimation methodologies\n• Improve consistency and accuracy in ROM, proposal, and SOW estimates\n• Capture lessons learned and continuously improve our estimation practices\nGoal: Build a trusted reference base that helps PS teams estimate faster, more consistently, and with greater confidence."}, "en": {"t": "Slack PS — Benchmark Estimates", "d": "PS — Reference Estimates\nA collaborative space for sharing, discussing, and maintaining reference estimates for Professional Services engagements.\nUse this channel to:\n• Share historical estimates, benchmarks, and sizing references\n• Compare estimates across projects, solutions, and delivery models\n• Discuss assumptions, complexity drivers, and estimation methodologies\n• Improve consistency and accuracy in ROM, proposal, and SOW estimates\n• Capture lessons learned and continuously improve our estimation practices\nGoal: Build a trusted reference base that helps PS teams estimate faster, more consistently, and with greater confidence."}}}, {"id": 595, "type": "setup", "tech": ["Cortex"], "phase": null, "theme": null, "author": "Diego Castro", "ini": "DC", "status": "completed", "date": "2026-08-04", "tags": ["Cortex"], "links": [], "i18n": {"es": {"t": "Cortex Console 6.0", "d": "Cortex Console 6 es una app Node.js + Express con UI web (\"Cockpit\") que genera artefactos de scoping/valor de Salesforce de forma programática, usando Claude + RAG, y persiste los resultados en un Google Drive compartido. Cada artefacto se genera desde un doc-spec versionado en el repo (p.ej. src/doc-specs/USB.json), no desde un template libre — eso es lo que garantiza que el resultado sea consistente y determinista sin importar quién lo ejecute."}, "pt": {"t": "Cortex Console 6.0", "d": "Cortex Console 6 es una app Node.js + Express con UI web (\"Cockpit\") que genera artefactos de scoping/valor de Salesforce de forma programática, usando Claude + RAG, y persiste los resultados en un Google Drive compartido. Cada artefacto se genera desde un doc-spec versionado en el repo (p.ej. src/doc-specs/USB.json), no desde un template libre — eso es lo que garantiza que el resultado sea consistente y determinista sin importar quién lo ejecute."}, "en": {"t": "Cortex Console 6.0", "d": "Cortex Console 6 es una app Node.js + Express con UI web (\"Cockpit\") que genera artefactos de scoping/valor de Salesforce de forma programática, usando Claude + RAG, y persiste los resultados en un Google Drive compartido. Cada artefacto se genera desde un doc-spec versionado en el repo (p.ej. src/doc-specs/USB.json), no desde un template libre — eso es lo que garantiza que el resultado sea consistente y determinista sin importar quién lo ejecute."}}}, {"id": 563, "type": "value", "tech": ["WhatsApp function hay(c){const l=L(c);return norm([l.t,l.d,c.author,c.tech.join(" "),c.tags.join(" "),c.phase,c.theme,t("types")[c.type]].join(" "))}
function score(c,q){
  const words=norm(q).split(/\s+/).filter(Boolean); if(!words.length) return 1;
  const title=norm(L(c).t), h=hay(c); let s=0;
  for(const w of words){ if(!h.includes(w)) return 0; s+= title.includes(w)?3:1; }
  return s;
}
function hl(text,q){
  const ws=norm(q).split(/\s+/).filter(w=>w.length>1); if(!ws.length) return esc(text);
  const n=norm(text); let out="",i=0;
  const marks=[]; ws.forEach(w=>{let p=n.indexOf(w);while(p>-1){marks.push([p,p+w.length]);p=n.indexOf(w,p+w.length)}});
  marks.sort((a,b)=>a[0]-b[0]);
  for(const [a,b] of marks){ if(a<i) continue; out+=esc(text.slice(i,a))+"<mark>"+esc(text.slice(a,b))+"</mark>"; i=b; }
  return out+esc(text.slice(i));
}

      <div class="byline">${avatar(c,"av lg")}<span><small>${t("byline")}</small><strong>${esc(c.author)}</strong></span></div>
      ${l.d?`<div class="desc">${esc(l.d)}</div>`:""}
      <div class="links">${c.links.length?c.links.map(x=>`<a class="link-btn" href="${esc(x.u)}" target="_blank" rel="noopener">${kdot(x.l)}<span>${t("open")} ${esc(x.l)}<small>${esc(x.u.replace(/^https?:\/\//,"").slice(0,70))}</small></span>${ico("ext")}</a>`).join(""):`<p class="meta">${t("noLinks")}</p>`}</div>
      <dl class="facts">
        <dt>${t("tech")}</dt><dd>${c.tech.map(esc).join(", ")||"–"}</dd>
        ${c.phase?`<dt>${t("phase")}</dt><dd>${esc(c.phase)}</dd>`:""}
        ${c.theme?`<dt>${t("theme")}</dt><dd>${esc(c.theme)}</dd>`:""}
        <dt>${t("status")}</dt><dd>${c.status==="completed"?t("stDone"):t("stWip")}</dd>
        <dt>${t("added")}</dt><dd>${fmtDate(c.date)}</dd>
        ${c.tags.length?`<dt>Tags</dt><dd><span class="tags">${c.tags.map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</span></dd>`:""}
      </dl>
      <p class="note">${ico("edit")} ${t("editNote")}</p>
    </div>`;
  lastFocus = lastFocus || document.activeElement;
  d.classList.add("show"); d.setAttribute("aria-hidden","false"); $("#scrim").classList.add("show");
  setTimeout(()=>$("[data-close-drawer]",d).focus(),50);
  $("#copyLink").onclick=()=>{navigator.clipboard?.writeText(location.href.split("?")[0]);toast(t("copied"))};
}
function closeDrawer(silent){
  const d=$("#drawer"); if(!d.classList.contains("show")) return;
  d.classList.remove("show"); d.setAttribute("aria-hidden","true"); $("#scrim").classList.remove("show");
  if(!silent && parse().id) { location.hash = hashFromState(); }
  lastFocus?.focus?.(); lastFocus=null;
}

/* ---------------- Recursos ---------------- */
function viewRes(r){
  const q0=r.q.get("q")||"";
  $("#app").innerHTML=`
  <div class="wrap">
    <div class="page-h"><h1>${t("resH")}</h1><p>${t("resP")}</p></div>
    <div class="keys grid">${DATA.keys.map(keyCard).join("")}</div>
    <div class="res-tools"><label class="search">${ico("search")}<span class="sr">${t("resSearch")}</span><input id="resQ" type="search" placeholder="${esc(t("resSearch"))}" value="${esc(q0)}"></label><span class="meta" id="resCount"></span></div>
    <div class="groups" id="groups"></div>
  </div>`;
  const draw=()=>{
    const q=$("#resQ").value.trim(), nq=norm(q); let n=0;
    const html=DATA.groups.map(g=>{
      const ls=g.links.filter(l=>!nq||norm(l.t+" "+l.k+" "+g[lang]).includes(nq)); n+=ls.length;
      if(!ls.length) return "";
      return `<section class="card group"><h3><span class="g-ico">${ico(g.icon)}</span>${esc(g[lang])}<small>${ls.length} ${t("links")}</small></h3>
        <ul>${ls.map(l=>`<li><a href="${esc(l.u)}" target="_blank" rel="noopener">${kdot(l.k)}<span>${hl(l.t,q)}</span><em>${esc(l.k)}</em></a></li>`).join("")}</ul></section>`;
    }).join("");
    $("#groups").innerHTML = html || `<div class="card empty"><p>${t("resNone")}</p></div>`;
    $("#resCount").textContent = `${n} ${t("links")}`;
  };
  $("#resQ").addEventListener("input",draw); draw();
}

/* ---------------- Palette ⌘K ---------------- */
let palSel=0;
function openPal(){ $("#pal").classList.add("show"); const i=$("#palInput"); i.placeholder=t("palPh"); i.value=""; drawPal(); setTimeout(()=>i.focus(),10); }
function closePal(){ $("#pal").classList.remove("show"); }
function drawPal(){
  const q=$("#palInput").value.trim(); palSel=0;
  const cases=(q?CASES.map(c=>[c,score(c,q)]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]).map(x=>x[0]):CASES).slice(0,q?6:4);
  const nq=norm(q);
  const links=q?[...DATA.keys.map(k=>({t:k.name,u:k.case?`#/casos/${k.case}`:k.u,k:"",sub:k[lang]||k.es,ico:k.icon})),...LINKS.map(l=>({t:l.t,u:l.u,k:l.k,sub:l.g[lang]}))].filter(l=>norm(l.t+" "+l.sub+" "+l.k).includes(nq)).slice(0,6):DATA.keys.slice(0,3).map(k=>({t:k.name,u:k.case?`#/casos/${k.case}`:k.u,sub:k[lang]||k.es,ico:k.icon}));
  const sess=DATA.sessions.filter(s=>!q||norm(s.title+" "+(s.copy[lang]||s.copy.es).tag).includes(nq));
  let html="";
  if(cases.length) html+=`<h4>${t("palCases")}</h4>`+cases.map(c=>`<a href="#/casos/${c.id}">${avatar(c)}<span><strong>${hl(L(c).t,q)}</strong><small>${esc(c.author)}, ${esc(t("types")[c.type].toLowerCase())}</small></span></a>`).join("");
  if(links.length) html+=`<h4>${t("palRes")}</h4>`+links.map(l=>`<a href="${esc(l.u)}" ${l.u.startsWith("#")?"":'target="_blank" rel="noopener"'}>${l.ico?`<span class="kdot" style="background:var(--mist);color:var(--blue)">${ico(l.ico)}</span>`:kdot(l.k)}<span><strong>${hl(l.t,q)}</strong><small>${esc(l.sub)}</small></span></a>`).join("");
  if(sess.length) html+=`<h4>${t("palLearn")}</h4>`+sess.map(s=>`<a href="#/learning"><span class="kdot" style="background:var(--navy)">${ico("play")}</span><span><strong>${esc(s.title)}</strong><small>${esc((s.copy[lang]||s.copy.es).tag)}</small></span></a>`).join("");
  $("#palList").innerHTML = html || `<p class="meta" style="padding:16px">${t("palNone")}</p>`;
  markPal();
}
function markPal(){ $$("#palList a").forEach((a,i)=>a.classList.toggle("on",i===palSel)); $$("#palList a")[palSel]?.scrollIntoView({block:"nearest"}); }
$("#palInput").addEventListener("input",drawPal);
$("#palInput").addEventListener("keydown",e=>{
  const items=$$("#palList a");
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();palSel=(palSel+(e.key==="ArrowDown"?1:-1)+items.length)%items.length;markPal()}
  if(e.key==="Enter"&&items[palSel]){e.preventDefault();items[palSel].click()}
});
$("#palList").addEventListener("click",e=>{ if(e.target.closest("a")) closePal(); });
$("#pal").addEventListener("click",e=>{ if(e.target.id==="pal") closePal(); });
$("#openPal").addEventListener("click",openPal);

/* ---------------- Global events ---------------- */
document.addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openPal()}
  if(e.key==="Escape"){ if($("#pal").classList.contains("show")) closePal(); else if($("#modal").classList.contains("show")) $("#modal").classList.remove("show"); else closeDrawer(); }
  if(e.key==="/" && !/input|textarea|select/i.test(document.activeElement.tagName)){e.preventDefault();openPal()}
  if(e.key==="Enter" && e.target.matches("article.case")) openCase(e.target.dataset.case);
});
function openCase(id){ if(parse().route==="casos"){ lastFocus=document.activeElement; location.hash=hashFromState(id);} else location.hash="#/casos/"+id; }
document.addEventListener("click",e=>{
  if(!e.target.closest(".qs")) $("#heroRes")?.classList.remove("show");
  const f=e.target.closest("[data-fav]");
  if(f){ e.stopPropagation(); const id=+f.dataset.fav; if(window.toggleFav){ window.toggleFav(id); return; }
    favs.has(id)?favs.delete(id):favs.add(id); saveFavs();
    $$(`[data-fav="${id}"]`).forEach(b=>{const on=favs.has(id);b.setAttribute("aria-pressed",on);b.setAttribute("aria-label",on?t("unfav"):t("fav")); if(b.classList.contains("icon-btn")) b.style.color=on?"var(--yellow)":"var(--navy)"});
    if($("#facets")) drawFacets(); toast(favs.has(id)?t("fav"):t("unfav")); return; }
  const c=e.target.closest("[data-case]"); if(c){ openCase(c.dataset.case); return; }
  if(e.target.closest("[data-close-drawer]")||e.target.id==="scrim"){ closeDrawer(); return; }
  if(e.target.closest("[data-contrib]")){ openModal(); return; }
  if(e.target.closest("[data-close]")){ $("#modal").classList.remove("show"); return; }
  const lb=e.target.closest("[data-lang]"); if(lb){ setLang(lb.dataset.lang); }
});
function openModal(){
  $("#fType").innerHTML=Object.entries(t("types")).map(([k,v])=>`<option value="${k}">${v}</option>`).join("");
  $("#modal").classList.add("show"); setTimeout(()=>$("#contribForm input").focus(),20);
}
// contrib submit handled by /lark-live.js
$("#modal").addEventListener("click",e=>{ if(e.target.id==="modal") $("#modal").classList.remove("show"); });

function setLang(l){
  lang=l; localStorage.setItem("lark.lang",l); document.documentElement.lang=l;
  $$("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===l));
  $$("[data-t]").forEach(el=>{const v=t(el.dataset.t); if(typeof v==="string") el.textContent=v});
  $$("[data-tp]").forEach(el=>el.placeholder=t(el.dataset.tp));
  $("#app").innerHTML=""; render();
}
setLang(lang);
</script>
<script src="/lark-live.js"></script>
